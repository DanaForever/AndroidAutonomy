# Android World Demo-Generation Config - Overfit 5 (always-failed)
#
# Brute-force demo collection for the sft-overfit-failed experiment.
# Copy of demos_overfit10.yaml with three changes:
#   - `tasks` pinned to 5 always-failed tasks
#   - `n_task_combinations` set to 50 (= 250 episodes total)
#   - `llm.temperature` raised from 0.0 → 1.0 (brute-force lever)
#
# UI-Voyager at T=0.0 produces deterministic failures on these 5 tasks
# (the always-failed analysis matrix). T=1.0 injects sampling variance so
# lucky-pass trajectories can appear; only successful rollouts are written
# to sft_data_dir (gate verified in Phase 1.1 of the plan).
#
# Companion eval configs (same task list, n_task_combinations=3 each):
#   - eval_overfit5_failed_base.yaml  → base Qwen3-VL-4B-Instruct
#   - eval_overfit5_failed_sft.yaml   → SFT checkpoint
# Plan: tasks/training-codebase/sft-overfit-failed/plan.html

env:
  console_port: 5556
  grpc_port: 8554
  adb_path: ~/Android/Sdk/platform-tools/adb
  emulator_path: ~/Android/Sdk/emulator/emulator
  avd_name: AndroidWorldAvd
  android_sdk_root: ~/Android/Sdk/
  android_avd_home: ~/.android/avd/

llm:
  type: openai
  base_url: http://localhost:9000
  model: UI-Voyager
  temperature: 1.0
  max_tokens: 16384
  top_p: 1
  max_retry: 3
  retry_delay: 1.0

agent:
  type: local
  name: Qwen3VL-Agent
  model_name: qwen3vl
  prompt_name: qwen3vl_instruct
  wait_after_action_seconds: 2
  use_som: false
  resize: null
  history_len: 30
  sft_data_dir: ./sft_data
  n_history_image: 0

eval:
  suite_family: android_world
  # Step budget per task = int(10 * task.complexity); all 5 tasks have complexity=1 → budget=10.
  tasks:
    - NotesTodoItemCount               # optimal 5, budget 10
    - SimpleCalendarEventsInNextWeek   # optimal 3, budget 10
    - SystemBrightnessMin              # optimal 3, budget 10
    - SystemCopyToClipboard
    - MarkorAddNoteHeader
  n_task_combinations: 50
  task_random_seed: 42
  checkpoint_dir: ""
  output_path: ~/android_world/runs
