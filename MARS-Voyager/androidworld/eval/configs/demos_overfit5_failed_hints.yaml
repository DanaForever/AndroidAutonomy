# Android World Demo-Generation Config - Overfit 5 (always-failed, with prompt hints)
#
# Same as demos_overfit5_failed.yaml but injects a per-task `Hint:` line into
# the user query. Used after empirically observing that T=1.0 alone does not
# dislodge UI-Voyager or base Qwen3-VL-4B-Instruct from their failure modes
# on these tasks — the agent keeps grounding the wrong app icon (e.g.
# Google Photos instead of Camera).
#
# Currently scoped to CameraTakePhoto only as a proof of concept. If hint
# steers the agent into successes, extend `task_hints` to the other 4 tasks.
#
# The hint plumbing: `agent.task_hints` is a {task_name: hint_string} dict.
# QwenAgent.step appends "\n\nHint: <hint>" to the goal before constructing
# the prompt. See MARS-Voyager/androidworld/eval/agents/qwen_agent.py.
#
# Plan: tasks/training-codebase/sft-overfit-failed/plan.html

env:
  console_port: 5556
  grpc_port: 8554
  adb_path: ~/Android/Sdk/platform-tools/adb
  emulator_path: ~/Android/Sdk/emulator/emulator
  avd_name: AndroidWorldAvd
  android_sdk_root: ~/Android/Sdk/
  android_avd_home: ~/.android/avd/

llm:
  type: openai
  base_url: http://localhost:9000
  model: UI-Voyager
  temperature: 1.0
  max_tokens: 16384
  top_p: 1
  max_retry: 3
  retry_delay: 1.0

agent:
  type: local
  name: Qwen3VL-Agent
  model_name: qwen3vl
  prompt_name: qwen3vl_instruct
  wait_after_action_seconds: 2
  use_som: false
  resize: null
  history_len: 30
  sft_data_dir: ./sft_data
  n_history_image: 0
  task_hints:
    CameraTakePhoto: "Open the App drawer by swiping up, then open the Camera app."

eval:
  suite_family: android_world
  # Step budget per task = int(10 * task.complexity); all 5 tasks have complexity=1 → budget=10.
  tasks:
    - CameraTakePhoto # optimal 2, budget 10
    - CameraTakeVideo # optimal 3, budget 10
    - NotesTodoItemCount # optimal 5, budget 10
    - SimpleCalendarEventsInNextWeek # optimal 3, budget 10
    - SystemBrightnessMin # optimal 3, budget 10
  n_task_combinations: 50
  task_random_seed: 42
  checkpoint_dir: ""
  output_path: ~/android_world/runs
