# Android World Evaluation Config - Overfit-failed cohort (base Qwen3-VL-4B-Instruct)
#
# Pre-SFT baseline. Identical to eval_overfit5_failed_sft.yaml except
# `llm.model` points at the off-the-shelf base model.
#
# Same task_random_seed and n_task_combinations as the SFT counterpart →
# directly comparable per-task outcomes.
#
# Note: Phase 2 (50-rollout brute force at T=1.0) already reported per-task
# pass rates for these tasks under base Qwen. This run reproduces them at
# T=0 with n_task_combinations=3 — the canonical eval protocol — so the
# baseline column in results.md matches the SFT eval column exactly.
#
# Plan: tasks/training-codebase/sft-overfit-failed/plan.html

env:
  console_port: 5556
  grpc_port: 8554
  adb_path: ~/Android/Sdk/platform-tools/adb
  emulator_path: ~/Android/Sdk/emulator/emulator
  avd_name: AndroidWorldAvd
  android_sdk_root: ~/Android/Sdk/
  android_avd_home: ~/.android/avd/

llm:
  type: openai
  base_url: http://localhost:9000
  model: Qwen3-VL-4B-Instruct
  temperature: 0.0
  max_tokens: 16384
  top_p: 1
  max_retry: 3
  retry_delay: 1.0

agent:
  type: local
  name: Qwen3VL-Agent
  model_name: qwen3vl
  prompt_name: qwen3vl_instruct
  wait_after_action_seconds: 2
  use_som: false
  resize: null
  history_len: 30
  sft_data_dir: ./sft_data
  n_history_image: 0

eval:
  suite_family: android_world
  # Step budget per task = int(10 * task.complexity); all 5 have complexity=1 → budget=10.
  tasks:
    - NotesTodoItemCount
    - SimpleCalendarEventsInNextWeek
    - SystemCopyToClipboard
    - SystemBrightnessMin
    - MarkorAddNoteHeader
  n_task_combinations: 3
  task_random_seed: 42
  checkpoint_dir: ""
  output_path: ~/android_world/runs
