# Android World Evaluation Config - Overfit-failed cohort (SFT checkpoint)
#
# Counterpart to eval_overfit5_failed_base.yaml. Same task list, T=0, matched
# task_random_seed; only llm.model differs. Direct base-vs-SFT comparison.
#
# Trained checkpoint: training/checkpoints/sft_overfit_failed_v0_1/global_step_<N>/huggingface
# Built from training/data/sft_overfit_failed_v0.1/{train,val}.parquet
# Training script: training/scripts/run_sft_overfit_failed.sh
#
# The 5 tasks split into two buckets:
#   * Trained on (3): NotesTodoItemCount, SimpleCalendarEventsInNextWeek, SystemCopyToClipboard
#     → headline question: did SFT lift pass-rate on these?
#   * Untrained (2): SystemBrightnessMin, MarkorAddNoteHeader
#     → control: zero demos available; expected ≈ base pass-rate. Confirms
#       SFT didn't accidentally regress on tasks it never saw.
#
# Plan: tasks/training-codebase/sft-overfit-failed/plan.html

env:
  console_port: 5556
  grpc_port: 8554
  adb_path: ~/Android/Sdk/platform-tools/adb
  emulator_path: ~/Android/Sdk/emulator/emulator
  avd_name: AndroidWorldAvd
  android_sdk_root: ~/Android/Sdk/
  android_avd_home: ~/.android/avd/

llm:
  type: openai
  base_url: http://localhost:9000
  # Must match --served-model-name passed to `vllm serve` for the SFT checkpoint.
  # Step number ({N}) is filled in once we know the save step from training.
  # Example: sft_overfit_failed_v0_1_step300
  model: sft_overfit_failed_v0_1
  temperature: 0.0
  max_tokens: 16384
  top_p: 1
  max_retry: 3
  retry_delay: 1.0

agent:
  type: local
  name: Qwen3VL-Agent
  model_name: qwen3vl
  prompt_name: qwen3vl_instruct
  wait_after_action_seconds: 2
  use_som: false
  resize: null
  history_len: 30
  sft_data_dir: ./sft_data
  n_history_image: 0

eval:
  suite_family: android_world
  # Step budget per task = int(10 * task.complexity); all 5 have complexity=1 → budget=10.
  tasks:
    - NotesTodoItemCount               # 43 demos
    - SimpleCalendarEventsInNextWeek   # 14 demos
    - SystemCopyToClipboard            #  8 demos
  n_task_combinations: 10
  task_random_seed: 42
  checkpoint_dir: ""
  output_path: ~/android_world/runs
