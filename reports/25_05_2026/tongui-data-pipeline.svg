<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 530" font-family="monospace" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="390" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">GUI-Net-1M: Data Curation Pipeline (TongUI, 2025)</text>

  <!-- ===== VIDEO BRANCH (center x=175) ===== -->
  <rect x="50" y="40" width="250" height="46" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="175" y="58" text-anchor="middle" font-weight="bold" fill="#1e40af">Video Tutorials</text>
  <text x="175" y="76" text-anchor="middle" fill="#1e40af" font-size="11">YouTube · Bilibili</text>

  <line x1="175" y1="86" x2="175" y2="104" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="50" y="104" width="250" height="38" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="175" y="120" text-anchor="middle" font-weight="bold" fill="#15803d">Whisper ASR</text>
  <text x="175" y="134" text-anchor="middle" fill="#15803d" font-size="11">transcript + word-level timestamps</text>

  <line x1="175" y1="142" x2="175" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="50" y="160" width="250" height="64" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="175" y="177" text-anchor="middle" font-weight="bold" fill="#15803d">Temporal Segmentation</text>
  <text x="175" y="192" text-anchor="middle" fill="#15803d" font-size="11">timestamps → segments</text>
  <text x="175" y="207" text-anchor="middle" fill="#15803d" font-size="11">MOG2 → key frames per segment</text>
  <text x="175" y="220" text-anchor="middle" fill="#9ca3af" font-size="10" font-style="italic">no audio: whole video = 1 segment</text>

  <!-- (o_i, h_i) label under video branch -->
  <text x="175" y="242" text-anchor="middle" fill="#374151" font-size="11" font-style="italic">(o_i, h_i) pairs</text>

  <!-- ===== ARTICLE BRANCH (center x=593) ===== -->
  <rect x="458" y="40" width="275" height="46" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="595" y="58" text-anchor="middle" font-weight="bold" fill="#92400e">Article Tutorials</text>
  <text x="595" y="76" text-anchor="middle" fill="#92400e" font-size="11">WikiHow · Baidu Exp.</text>

  <line x1="595" y1="86" x2="595" y2="104" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="458" y="104" width="275" height="38" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="595" y="120" text-anchor="middle" font-weight="bold" fill="#854d0e">LLM Extraction</text>
  <text x="595" y="134" text-anchor="middle" fill="#854d0e" font-size="11">task query q + step descriptions h_i</text>

  <line x1="595" y1="142" x2="595" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="458" y="160" width="275" height="38" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="595" y="177" text-anchor="middle" font-weight="bold" fill="#854d0e">GPT-4o-mini Filter</text>
  <text x="595" y="193" text-anchor="middle" fill="#854d0e" font-size="11">remove non-GUI images (diagrams, photos)</text>

  <!-- (o_i, h_i) label under article branch -->
  <text x="595" y="218" text-anchor="middle" fill="#374151" font-size="11" font-style="italic">(o_i, h_i) pairs</text>

  <!-- ===== MERGE: both branches converge at y=250, center x=385 ===== -->
  <!-- left branch down to merge horizontal -->
  <line x1="175" y1="245" x2="175" y2="258" stroke="#555" stroke-width="1.5"/>
  <!-- right branch down to merge horizontal -->
  <line x1="595" y1="222" x2="595" y2="258" stroke="#555" stroke-width="1.5"/>
  <!-- horizontal merge line -->
  <line x1="175" y1="258" x2="595" y2="258" stroke="#555" stroke-width="1.5"/>
  <!-- arrow down from midpoint to trajectory gen -->
  <line x1="385" y1="258" x2="385" y2="276" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== TRAJECTORY GENERATION ===== -->
  <rect x="235" y="276" width="300" height="58" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="385" y="296" text-anchor="middle" font-weight="bold" fill="#4c1d95" font-size="13">Trajectory Generation</text>
  <text x="385" y="312" text-anchor="middle" fill="#4c1d95" font-size="11">UI-TARS: (o_i, h_i) → thought r_i + action a_i</text>
  <text x="385" y="327" text-anchor="middle" fill="#7c3aed" font-size="10">failed step → discard and split trajectory</text>

  <line x1="385" y1="334" x2="385" y2="352" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== FILTERING ===== -->
  <rect x="195" y="352" width="380" height="82" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="385" y="372" text-anchor="middle" font-weight="bold" fill="#991b1b" font-size="13">3-Stage Filtering  (~33% retained)</text>
  <text x="215" y="391" fill="#7f1d1d" font-size="11">① Dedup: URL / video-ID exact match</text>
  <text x="215" y="407" fill="#7f1d1d" font-size="11">② LLM content filter: GUI-relevant tutorials only</text>
  <text x="215" y="423" fill="#7f1d1d" font-size="11">③ Quality: discard wait/call_user; Qwen2.5-VL-7B score</text>

  <line x1="385" y1="434" x2="385" y2="452" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== OUTPUT ===== -->
  <rect x="195" y="452" width="380" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="385" y="473" text-anchor="middle" font-weight="bold" fill="#14532d" font-size="13">GUI-Net-1M  (~895K trajectories)</text>
  <text x="385" y="492" text-anchor="middle" fill="#14532d" font-size="11">sample: (q, { o_i, r_i, a_i }^T)  ·  5 OS  ·  280+ apps</text>

</svg>
