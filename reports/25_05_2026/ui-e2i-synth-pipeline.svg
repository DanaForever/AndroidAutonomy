<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 530" font-family="monospace" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">UI-E2I-Synth: Data Synthesis Pipeline (Liu et al. 2025)</text>

  <!-- ===== STEP 1 LABEL ===== -->
  <text x="350" y="40" text-anchor="middle" font-size="11" fill="#6b7280">Step 1 — Raw Data Collection &amp; Parsing</text>

  <!-- Three source boxes: centers at x=140, 350, 560 -->
  <rect x="50" y="48" width="180" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="67" text-anchor="middle" font-weight="bold" fill="#1e40af">Web (CommonCrawl)</text>
  <text x="140" y="82" text-anchor="middle" fill="#1e40af" font-size="10">top 500k domains · 3pp each</text>
  <text x="140" y="94" text-anchor="middle" fill="#1e40af" font-size="10">724,839 pages · 7 resolutions</text>

  <rect x="260" y="48" width="180" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="350" y="67" text-anchor="middle" font-weight="bold" fill="#1e40af">Windows Apps</text>
  <text x="350" y="82" text-anchor="middle" fill="#1e40af" font-size="10">90 apps · auto-traversal</text>
  <text x="350" y="94" text-anchor="middle" fill="#1e40af" font-size="10">15K screenshot-metadata pairs</text>

  <rect x="470" y="48" width="180" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="560" y="67" text-anchor="middle" font-weight="bold" fill="#1e40af">Android</text>
  <text x="560" y="82" text-anchor="middle" fill="#1e40af" font-size="10">AndroidControl training split</text>
  <text x="560" y="94" text-anchor="middle" fill="#1e40af" font-size="10">40K screenshot-metadata pairs</text>

  <!-- metadata format labels -->
  <text x="140" y="107" text-anchor="middle" fill="#6b7280" font-size="10" font-style="italic">DOM</text>
  <text x="350" y="107" text-anchor="middle" fill="#6b7280" font-size="10" font-style="italic">UIA</text>
  <text x="560" y="107" text-anchor="middle" fill="#6b7280" font-size="10" font-style="italic">View Hierarchy</text>

  <!-- Converge lines down to heuristic parser -->
  <line x1="140" y1="109" x2="140" y2="126" stroke="#555" stroke-width="1.2"/>
  <line x1="350" y1="109" x2="350" y2="126" stroke="#555" stroke-width="1.2"/>
  <line x1="560" y1="109" x2="560" y2="126" stroke="#555" stroke-width="1.2"/>
  <line x1="140" y1="126" x2="560" y2="126" stroke="#555" stroke-width="1.2"/>
  <line x1="350" y1="126" x2="350" y2="140" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Heuristic Parser -->
  <rect x="225" y="140" width="250" height="38" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="350" y="156" text-anchor="middle" font-weight="bold" fill="#15803d">Heuristic Metadata Parser</text>
  <text x="350" y="170" text-anchor="middle" fill="#15803d" font-size="10">→ element type · content · bounding box</text>

  <line x1="350" y1="178" x2="350" y2="193" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Element Candidates Pool -->
  <rect x="180" y="193" width="340" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="350" y="210" text-anchor="middle" font-weight="bold" fill="#92400e">Element Candidates Pool</text>
  <text x="350" y="225" text-anchor="middle" fill="#92400e" font-size="10">5 types: Text · Inputfield · Dropdown · Icon · Toggle  (resampled for balance)</text>

  <!-- Step 2 divider -->
  <line x1="20" y1="246" x2="680" y2="246" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="350" y="259" text-anchor="middle" font-size="11" fill="#6b7280">Step 2 — Referring Expression Generation  (GPT-4o)</text>

  <line x1="350" y1="233" x2="350" y2="268" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- RE Generator -->
  <rect x="225" y="268" width="250" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="350" y="284" text-anchor="middle" font-weight="bold" fill="#4c1d95">RE Generator (GPT-4o)</text>
  <text x="350" y="300" text-anchor="middle" fill="#4c1d95" font-size="10">Set-of-Marks screenshot + element attributes</text>

  <line x1="350" y1="308" x2="350" y2="323" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Element RE Pool -->
  <rect x="130" y="323" width="440" height="58" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="350" y="340" text-anchor="middle" font-weight="bold" fill="#831843">Element RE Pool</text>
  <text x="350" y="356" text-anchor="middle" fill="#831843" font-size="10">explicit RE: directly refers to visible features</text>
  <text x="350" y="370" text-anchor="middle" fill="#831843" font-size="10">implicit RE: by function/outcome  ·  by spatial relation to nearby elements</text>

  <!-- Step 3 divider -->
  <line x1="20" y1="394" x2="680" y2="394" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="350" y="407" text-anchor="middle" font-size="11" fill="#6b7280">Step 3 — Instruction Synthesis  (GPT-4o)</text>

  <line x1="350" y1="381" x2="350" y2="416" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Instruction Synthesizer -->
  <rect x="175" y="416" width="350" height="56" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="350" y="434" text-anchor="middle" font-weight="bold" fill="#4c1d95">Instruction Synthesizer (GPT-4o)</text>
  <text x="350" y="449" text-anchor="middle" fill="#4c1d95" font-size="10">① decompose: generate action type + action content</text>
  <text x="350" y="463" text-anchor="middle" fill="#4c1d95" font-size="10">② combine RE + action params → user instruction</text>

  <line x1="350" y1="472" x2="350" y2="487" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="110" y="487" width="480" height="30" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="350" y="507" text-anchor="middle" font-weight="bold" fill="#14532d">&lt;screenshot, user instruction, element coordinates&gt;  ·  9.9M instructions</text>

</svg>
